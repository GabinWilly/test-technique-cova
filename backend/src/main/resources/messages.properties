# Bundle de base, volontairement vide.
#
# Le francais est la langue par defaut de l'API : AcceptHeaderLocaleResolver
# renvoie Locale.FRENCH pour toute langue non supportee, donc la resolution
# atterrit toujours sur messages_fr.properties.
#
# Le laisser vide est delibere : une cle absente d'un fichier de langue leve
# une erreur au lieu d'etre silencieusement remplacee par une valeur anglaise
# codee en dur, ce qui rendrait la traduction manquante invisible.
