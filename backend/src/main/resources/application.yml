spring:
  application:
    name: taskmanager

  messages:
    basename: messages
    encoding: UTF-8
    # sans ca, une cle absente retomberait sur la locale de la machine hote
    fallback-to-system-locale: false

  datasource:
    # DATABASE_URL permet de fournir une URL complete, par exemple pour passer
    # par le socket Cloud SQL, sans avoir a reconstruire l'URL piece par piece.
    url: ${DATABASE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:taskmanager}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USER:taskuser}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

server:
  # Cloud Run impose le port par la variable PORT et ne laisse pas le choix ;
  # en local on retombe sur 8081, car 8080 est occupe sur la machine de dev.
  port: ${PORT:${SERVER_PORT:8081}}

app:
  jwt:
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWEtcmVtcGxhY2VyLWVuLXByb2R1Y3Rpb24tMjU2Yml0cw==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5174}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    # INFO par defaut : un deploiement ne doit pas etre bavard. Le .env local
    # passe a DEBUG pour le developpement.
    com.cova.taskmanager: ${APP_LOG_LEVEL:INFO}
