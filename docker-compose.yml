services:
  mysql:
    image: mysql:8.0
    container_name: taskcova-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      # 3306 est deja utilise par d'autres projets sur cette machine
      - "${MYSQL_PORT}:3306"
    volumes:
      - taskcova-mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - taskcova

volumes:
  taskcova-mysql-data:
    name: taskcova-mysql-data

networks:
  taskcova:
    name: taskcova
