name: Deploiement Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGION: europe-west1
  REPOSITORY: taskcova
  BACKEND_SERVICE: taskcova-backend
  FRONTEND_SERVICE: taskcova-frontend

jobs:
  deploy:
    name: Construire, publier et deployer
    runs-on: ubuntu-latest

    # Le deploiement est le seul job qui depend de GCP : sans les secrets, le
    # depot reste utilisable et la CI continue de passer.
    if: ${{ vars.GCP_PROJECT_ID != '' }}
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # Federation d'identite : aucune cle de compte de service a stocker dans
      # le depot, donc rien a faire fuiter ni a faire tourner.
      - name: Authentification Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Autoriser Docker aupres d'Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Publier l'image du backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          # Deux etiquettes : le SHA pour pouvoir revenir a une version precise,
          # latest pour la lisibilite.
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/backend:${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deployer le backend
        run: |
          gcloud run deploy ${{ env.BACKEND_SERVICE }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/backend:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --add-cloudsql-instances "${{ secrets.CLOUD_SQL_INSTANCE }}" \
            --set-env-vars "DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --set-env-vars "DB_USER=${{ secrets.DB_USER }}" \
            --set-env-vars "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" \
            --set-env-vars "JWT_SECRET=${{ secrets.JWT_SECRET }}" \
            --set-env-vars "APP_LOG_LEVEL=INFO" \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --quiet

      - name: Relever l'URL du backend
        id: backend_url
        run: |
          url=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
            --region ${{ env.REGION }} --format 'value(status.url)')
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Publier l'image du frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:${{ github.sha }}
            ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deployer le frontend
        run: |
          gcloud run deploy ${{ env.FRONTEND_SERVICE }} \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/frontend:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "BACKEND_URL=${{ steps.backend_url.outputs.url }}" \
            --memory 256Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --quiet

      - name: Relever l'URL du frontend
        id: frontend_url
        run: |
          url=$(gcloud run services describe ${{ env.FRONTEND_SERVICE }} \
            --region ${{ env.REGION }} --format 'value(status.url)')
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # L'origine publique du frontend doit figurer dans la liste CORS du
      # backend, meme si nginx proxifie : le navigateur envoie un en-tete Origin
      # sur les POST, y compris en meme-origine, et Spring refuse toute origine
      # absente de la liste.
      #
      # Elle n'est connue qu'ici, apres le deploiement du frontend, d'ou cette
      # mise a jour en fin de course plutot qu'une variable a renseigner a la
      # main. Elle ne cree pas de nouvelle revision si la valeur est inchangee.
      - name: Declarer l'origine du frontend au backend
        run: |
          gcloud run services update ${{ env.BACKEND_SERVICE }} \
            --region ${{ env.REGION }} \
            --update-env-vars "CORS_ALLOWED_ORIGINS=${{ steps.frontend_url.outputs.url }}" \
            --quiet

      - name: Recapitulatif
        run: |
          front="${{ steps.frontend_url.outputs.url }}"
          {
            echo "### Deploiement termine"
            echo ""
            echo "| Service | URL |"
            echo "|---|---|"
            echo "| Frontend | $front |"
            echo "| Backend | ${{ steps.backend_url.outputs.url }} |"
            echo ""
            echo "Version deployee : \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
