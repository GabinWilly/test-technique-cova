name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Une nouvelle poussee annule la precedente sur la meme branche : inutile de
# payer un build dont le resultat ne sera plus regarde.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — build et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Les tests tournent sur H2 en memoire : aucun service MySQL a demarrer.
      - name: Tests
        working-directory: backend
        run: ./mvnw -B verify

      - name: Archiver le jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

  frontend:
    name: Frontend — lint, types et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dependances
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npx oxlint src

      # `npm run build` enchaine `tsc -b` : la verification de types echoue le
      # job avant meme la construction du bundle.
      - name: Build
        working-directory: frontend
        run: npm run build

  mobile:
    name: Mobile — analyse et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: stable
          cache: true

      - name: Installer les dependances
        working-directory: mobile
        run: flutter pub get

      - name: Analyse statique
        working-directory: mobile
        run: flutter analyze

      - name: Tests
        working-directory: mobile
        run: flutter test

  docker:
    name: Images Docker
    runs-on: ubuntu-latest
    # Les images ne sont construites que si le code compile et passe les tests.
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Construction sans publication : ce job verifie que les Dockerfile
      # tiennent. La publication appartient au workflow de deploiement.
      - name: Construire l'image du backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Construire l'image du frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
